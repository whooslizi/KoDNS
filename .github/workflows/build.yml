name: Build plugin

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download latest dnsproxy linux-arm7
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo AdguardTeam/dnsproxy --json tagName -q .tagName)
          echo "DNSPROXY_TAG=$tag" >> "$GITHUB_ENV"
          gh release download "$tag" --repo AdguardTeam/dnsproxy \
            --pattern "dnsproxy-linux-arm7-$tag.tar.gz" --dir /tmp/dl
          tar xzf "/tmp/dl/dnsproxy-linux-arm7-$tag.tar.gz" -C /tmp/dl
          # refuse anything that is not a 32-bit ARM binary
          file /tmp/dl/linux-arm7/dnsproxy | grep -q 'ELF 32-bit LSB executable, ARM'

      - name: Assemble plugin zip
        run: |
          mkdir dist
          cp -r kodns.koplugin dist/
          rm -f dist/kodns.koplugin/bin/.gitkeep
          cp README.md dist/kodns.koplugin/README.md
          cp /tmp/dl/linux-arm7/dnsproxy dist/kodns.koplugin/bin/dnsproxy
          chmod +x dist/kodns.koplugin/bin/dnsproxy
          # the in-app updater compares this with the latest release tag
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="$GITHUB_REF_NAME"; else v="dev-${GITHUB_SHA::7}"; fi
          echo "$v" > dist/kodns.koplugin/VERSION
          # zip for people, tar.gz for the in-app updater (BusyBox always has tar)
          (cd dist && zip -r kodns.koplugin.zip kodns.koplugin && tar czf kodns.koplugin.tar.gz kodns.koplugin)

      - uses: actions/upload-artifact@v4
        with:
          name: kodns.koplugin-dnsproxy-${{ env.DNSPROXY_TAG }}
          path: |
            dist/kodns.koplugin.zip
            dist/kodns.koplugin.tar.gz

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/kodns.koplugin.zip dist/kodns.koplugin.tar.gz \
            --title "KoDNS $GITHUB_REF_NAME" \
            --notes "Includes dnsproxy $DNSPROXY_TAG (linux-arm7). Unzip and copy kodns.koplugin to koreader/plugins/ on the Kindle."
